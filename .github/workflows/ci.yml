name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Lint (HTMLHint)
        # Key point: add --fail-on-warn to ensure warnings also cause failure
        run: npx --yes htmlhint "**/*.html" --fail-on-warn
        
      - name: Test (validate HTML)
        run: npx --yes html-validate "**/*.html"
        
      - name: Build
        run: |
          mkdir -p dist
          rsync -av --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/
          
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist