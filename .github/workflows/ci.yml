name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Lint (HTMLHint)
        run: npx --yes htmlhint "**/*.html"
        
      - name: Test (validate HTML)
        # Pin for Node 20 and avoid npm's optional peer-dependency resolution crash.
        run: npx --yes --legacy-peer-deps html-validate@10.5.0 "**/*.html"
        
      - name: Build
        run: |
          mkdir -p dist
          rsync -av --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/
          
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist